name: Homebrew package
on:
  push:
    paths: ['Formula/**', '*.py', 'locales/**', 'tests/**', 'requirements.txt', '.github/workflows/homebrew.yml']
  pull_request:
    paths: ['Formula/**', '*.py', 'locales/**', 'tests/**', 'requirements.txt', '.github/workflows/homebrew.yml']
permissions:
  contents: read
jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install, upgrade, fail, retry and verify the installed wizard
        run: python3 tests/integration/homebrew_lifecycle.py --log-dir "${{ runner.temp }}/homebrew-lifecycle-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homebrew-lifecycle-logs
          path: ${{ runner.temp }}/homebrew-lifecycle-logs
